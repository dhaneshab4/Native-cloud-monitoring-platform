# Provisions the toolchain on a build/ops host — the machine a Jenkins agent or
# an engineer works from. Pinned versions on purpose: an ops host where everyone
# has a slightly different kubectl is how "works on my machine" reaches production.
#
#   ansible-playbook -i inventory.ini ops-host.yml
#   ansible-playbook -i inventory.ini ops-host.yml --check --diff   # dry run
---
- name: Provision a DevOps ops host
  hosts: ops
  become: true

  vars:
    ops_user: "{{ ansible_user | default('ubuntu') }}"
    terraform_version: "1.10.3"
    kubectl_version: "1.31.4"
    helm_version: "3.16.3"
    argocd_version: "2.13.2"
    arch_map:
      x86_64: amd64
      aarch64: arm64
    arch: "{{ arch_map[ansible_architecture] | default('amd64') }}"

  handlers:
    - name: Restart docker
      ansible.builtin.systemd:
        name: docker
        state: restarted
        daemon_reload: true

  tasks:
    - name: Install base packages
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - git
          - gnupg
          - jq
          - unzip
          - python3
          - python3-pip
          - python3-venv
        state: present
        update_cache: true
        cache_valid_time: 3600

    # ------------------------------------------------------------- docker
    - name: Ensure the apt keyring directory exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Add the Docker apt key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Add the Docker repository
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch={{ arch }} signed-by=/etc/apt/keyrings/docker.asc]
          https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable
        filename: docker
        state: present

    - name: Install Docker Engine
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true
      notify: Restart docker

    - name: Cap the journald-backed container logs
      ansible.builtin.copy:
        dest: /etc/docker/daemon.json
        mode: "0644"
        content: |
          {
            "log-driver": "json-file",
            "log-opts": {"max-size": "10m", "max-file": "3"}
          }
      notify: Restart docker

    - name: Let the ops user run docker without sudo
      ansible.builtin.user:
        name: "{{ ops_user }}"
        groups: docker
        append: true

    # -------------------------------------------------------- binary tools
    - name: Install kubectl
      ansible.builtin.get_url:
        url: "https://dl.k8s.io/release/v{{ kubectl_version }}/bin/linux/{{ arch }}/kubectl"
        dest: /usr/local/bin/kubectl
        mode: "0755"

    - name: Install the Argo CD CLI
      ansible.builtin.get_url:
        url: >-
          https://github.com/argoproj/argo-cd/releases/download/v{{ argocd_version }}/argocd-linux-{{ arch }}
        dest: /usr/local/bin/argocd
        mode: "0755"

    - name: Unpack Helm
      ansible.builtin.unarchive:
        src: "https://get.helm.sh/helm-v{{ helm_version }}-linux-{{ arch }}.tar.gz"
        dest: /tmp
        remote_src: true
        creates: "/tmp/linux-{{ arch }}/helm"

    - name: Install Helm
      ansible.builtin.copy:
        src: "/tmp/linux-{{ arch }}/helm"
        dest: /usr/local/bin/helm
        mode: "0755"
        remote_src: true

    - name: Install Terraform
      ansible.builtin.unarchive:
        src: >-
          https://releases.hashicorp.com/terraform/{{ terraform_version }}/terraform_{{ terraform_version }}_linux_{{ arch }}.zip
        dest: /usr/local/bin
        remote_src: true
        mode: "0755"
        creates: /usr/local/bin/terraform

    - name: Install the AWS CLI
      block:
        - name: Fetch the AWS CLI bundle
          ansible.builtin.unarchive:
            src: "https://awscli.amazonaws.com/awscli-exe-linux-{{ ansible_architecture }}.zip"
            dest: /tmp
            remote_src: true
            creates: /tmp/aws/install
        - name: Run the AWS CLI installer
          ansible.builtin.command: /tmp/aws/install --update
          args:
            creates: /usr/local/bin/aws

    # ------------------------------------------------------------ verify
    # A playbook that installs without checking has only proved it can download.
    - name: Verify every tool answers
      ansible.builtin.command: "{{ item }}"
      changed_when: false
      loop:
        - docker --version
        - kubectl version --client=true
        - helm version --short
        - terraform version
        - argocd version --client
        - aws --version
      register: tool_versions

    - name: Report the installed toolchain
      ansible.builtin.debug:
        msg: "{{ tool_versions.results | map(attribute='stdout_lines') | flatten }}"
