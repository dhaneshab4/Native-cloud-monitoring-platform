groups:
  - name: host-resources
    rules:
      - alert: HighCPU
        expr: system_cpu_percent > 80
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: "CPU above 80% for 2 minutes"
          description: "CPU is at {{ $value | printf \"%.1f\" }}%."

      - alert: HighMemory
        expr: system_memory_percent > 80
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: "Memory above 80% for 2 minutes"

      - alert: DiskAlmostFull
        expr: system_disk_percent > 85
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "Disk above 85% on {{ $labels.path }}"

      - alert: ServiceDegraded
        expr: system_status == 0
        for: 1m
        labels: {severity: warning}
        annotations:
          summary: "Application reports degraded status"

      - alert: TargetDown
        expr: up{job="monitoring-app"} == 0
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: "Prometheus cannot scrape the monitoring app"

  - name: retrieval
    rules:
      - alert: RunbookIndexStale
        expr: rag_index_stale == 1
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "Runbook index does not match the runbooks on disk"
          description: "Search is answering from an outdated corpus. Rebuild and redeploy."

      - alert: RetrievalQualityDropping
        expr: avg_over_time(rag_top_score[30m]) < 0.2 and rate(rag_queries_total[30m]) > 0
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: "Best-match scores have been low for 30 minutes"
          description: >-
            Either people are asking about things the runbooks do not cover, which is a
            content gap, or retrieval has regressed. Both are worth knowing about.

      - alert: RetrievalSlow
        expr: histogram_quantile(0.95, sum by (le) (rate(rag_query_duration_seconds_bucket[5m]))) > 0.5
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "Runbook search p95 above 500ms"
