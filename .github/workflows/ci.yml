name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/cloud-native-monitoring-app

# A second push to the same branch cancels the first; no point paying for a
# build whose result is already stale.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------------------------- lint
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: ruff check
        run: ruff check app tests
      - name: ruff format --check
        run: ruff format --check app tests

  # -------------------------------------------------------------------- tests
  test:
    name: Test (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: pytest
        run: pytest -q --cov=app --cov-report=xml --cov-report=term-missing --cov-fail-under=90
      - name: Upload coverage
        if: matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  # ------------------------------------------------------------------- config
  validate-config:
    name: Validate Prometheus config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: promtool check
        run: |
          docker run --rm -v "$PWD/deploy:/cfg" --entrypoint promtool \
            prom/prometheus:v3.1.0 check config /cfg/prometheus.yml
          docker run --rm -v "$PWD/deploy:/cfg" --entrypoint promtool \
            prom/prometheus:v3.1.0 check rules /cfg/alerts.yml

  # -------------------------------------------------------------------- build
  build:
    name: Build image
    runs-on: ubuntu-latest
    needs: [lint, test, validate-config]
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      # Load into the local daemon first so the image can be smoke-tested
      # before it is ever pushed to the registry.
      - name: Build (load locally)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          load: true
          tags: monitoring-app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the built image
        run: |
          docker run -d --name smoke -p 5000:5000 monitoring-app:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:5000/healthz >/dev/null 2>&1; then
              echo "app is up after ${i}s"; break
            fi
            if [ "$i" -eq 30 ]; then
              echo "app did not become healthy"; docker logs smoke; exit 1
            fi
            sleep 1
          done
          curl -fsS http://localhost:5000/readyz | grep -q ready
          curl -fsS http://localhost:5000/metrics | grep -q system_cpu_percent
          curl -fsS http://localhost:5000/api/metrics | grep -q cpu_percent
          echo "checking the container runs as non-root"
          test "$(docker exec smoke id -u)" = "10001"
          docker rm -f smoke

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@0.29.0
        with:
          image-ref: monitoring-app:ci
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload scan results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy.sarif

      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ------------------------------------------------------------ stack up-test
  integration:
    name: Compose stack
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - name: Bring the full stack up
        run: docker compose up -d --build
      - name: Wait for the app to be healthy
        run: |
          for i in $(seq 1 60); do
            state=$(docker inspect -f '{{.State.Health.Status}}' monitoring-app 2>/dev/null || echo starting)
            if [ "$state" = "healthy" ]; then
              echo "healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "container never became healthy"
          docker compose logs
          exit 1
      - name: Prometheus is scraping the app
        run: |
          query='http://localhost:9090/api/v1/query?query=up{job="monitoring-app"}'
          for i in $(seq 1 30); do
            up=$(curl -fsS "$query" | grep -o '"value":\[[^]]*,"1"\]' || true)
            if [ -n "$up" ]; then
              echo "target is up after $((i * 2))s"
              exit 0
            fi
            sleep 2
          done
          echo "prometheus never saw the target as up"
          curl -s http://localhost:9090/api/v1/targets
          exit 1
      - name: Grafana is serving
        run: |
          curl -fsS http://localhost:3000/api/health | grep -q '"database"'
      - name: Tear down
        if: always()
        run: docker compose down -v
