name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/cloud-native-monitoring-app

# A second push to the same branch cancels the first; no point paying for a
# build whose result is already stale.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------------------------- lint
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: ruff check
        run: ruff check app tests
      - name: ruff format --check
        run: ruff format --check app tests

  # -------------------------------------------------------------------- tests
  test:
    name: Test (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: pytest
        run: pytest -q --cov=app --cov-report=xml --cov-report=term-missing --cov-fail-under=90
      - name: Upload coverage
        if: matrix.python == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml

  # ------------------------------------------------------------------- config
  validate-config:
    name: Validate Prometheus config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Mounted at the real runtime path, not a scratch dir: prometheus.yml
      # references /etc/prometheus/alerts.yml absolutely, so validating anywhere
      # else silently checks a different layout than the one that ships.
      - name: promtool check
        run: |
          docker run --rm -v "$PWD/deploy:/etc/prometheus:ro" --entrypoint promtool \
            prom/prometheus:v3.1.0 check config /etc/prometheus/prometheus.yml
          docker run --rm -v "$PWD/deploy:/etc/prometheus:ro" --entrypoint promtool \
            prom/prometheus:v3.1.0 check rules /etc/prometheus/alerts.yml

  # --------------------------------------------------------------- manifests
  validate-manifests:
    name: Validate Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: kubeconform
        run: |
          curl -sSLo kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar xf kubeconform.tar.gz kubeconform
          # ServiceMonitor is a CRD, so pull the operator schemas too.
          ./kubeconform -strict -summary \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            deploy/k8s/

  # ----------------------------------------------------------- model quality
  # The same idea as the coverage floor, applied to retrieval. A change to the
  # runbooks, the chunker, the tokeniser or the backend can quietly make search
  # worse, and no amount of reading the diff will tell you. This measures it.
  eval:
    name: Retrieval quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Score retrieval against the golden set
        run: |
          python -m eval.run_eval --backend lsa \
            --fail-under-recall3 0.90 \
            --fail-under-mrr 0.80
      - name: Publish the eval report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-report
          path: eval/report.json
      - name: Summarise on the run page
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          p = pathlib.Path("eval/report.json")
          if not p.exists():
              print("### Retrieval quality\n\nNo report produced.")
              raise SystemExit
          r = json.loads(p.read_text())["results"][0]
          print("### Retrieval quality\n")
          print(f"Backend `{r['backend']}` over {r['documents']} runbooks, {r['cases']} queries.\n")
          print("| metric | value |")
          print("| --- | --- |")
          print(f"| recall@1 | {r['recall@1']:.1%} |")
          print(f"| recall@3 | {r['recall@3']:.1%} |")
          print(f"| recall@5 | {r['recall@5']:.1%} |")
          print(f"| MRR | {r['mrr']:.4f} |")
          print(f"| latency p95 | {r['latency_ms_p95']:.2f} ms |")
          PY

  # -------------------------------------------------------------------- build
  build:
    name: Build image
    runs-on: ubuntu-latest
    needs: [lint, test, validate-config, validate-manifests, eval]
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write   # cosign keyless signing via OIDC
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      # Load into the local daemon first so the image can be smoke-tested
      # before it is ever pushed to the registry.
      - name: Build (load locally)
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          load: true
          tags: monitoring-app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the built image
        run: |
          docker run -d --name smoke -p 5000:5000 monitoring-app:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:5000/healthz >/dev/null 2>&1; then
              echo "app is up after ${i}s"; break
            fi
            if [ "$i" -eq 30 ]; then
              echo "app did not become healthy"; docker logs smoke; exit 1
            fi
            sleep 1
          done
          curl -fsS http://localhost:5000/readyz | grep -q ready
          curl -fsS http://localhost:5000/metrics | grep -q system_cpu_percent
          curl -fsS http://localhost:5000/api/metrics | grep -q cpu_percent
          echo "checking the baked-in runbook index is present and serving"
          curl -fsS 'http://localhost:5000/api/search?q=no+space+left+on+device' | grep -q disk-full
          curl -fsS http://localhost:5000/metrics | grep -q rag_index_documents
          echo "checking the container runs as non-root"
          test "$(docker exec smoke id -u)" = "10001"
          docker rm -f smoke

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: monitoring-app:ci
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload scan results
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy.sarif

      - name: Push
        id: push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # -------------------------------------------------- supply chain
      # Sign the digest, not a tag: tags are mutable and can be repointed at
      # a different image after the signature is made.
      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3

      - name: Sign the image (keyless, OIDC)
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${REGISTRY}/${IMAGE_NAME}@${DIGEST}"

      - name: Generate SBOM
        if: github.event_name != 'pull_request'
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Attest the SBOM to the image
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign attest --yes --predicate sbom.spdx.json --type spdxjson \
            "${REGISTRY}/${IMAGE_NAME}@${DIGEST}"

      - name: Publish the SBOM as a build artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom.spdx.json

  # ------------------------------------------------------------ stack up-test
  integration:
    name: Compose stack
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v7
      - name: Bring the full stack up
        run: docker compose up -d --build
      - name: Wait for the app to be healthy
        run: |
          for i in $(seq 1 60); do
            state=$(docker inspect -f '{{.State.Health.Status}}' monitoring-app 2>/dev/null || echo starting)
            if [ "$state" = "healthy" ]; then
              echo "healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "container never became healthy"
          docker compose logs
          exit 1
      - name: Wait for Prometheus to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:9090/-/ready >/dev/null 2>&1; then
              echo "prometheus ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::prometheus never became ready"
          docker compose logs --no-color prometheus | tail -50
          exit 1

      # The query is passed through --data-urlencode rather than pasted into the
      # URL: it contains {, } and quotes, which are not valid unencoded in a
      # query string. Parsing the JSON beats grepping it — an empty result set
      # and a result of 0 are different states and should not look alike.
      - name: Prometheus is scraping the app
        run: |
          for i in $(seq 1 40); do
            value=$(curl -sS -G http://localhost:9090/api/v1/query \
                      --data-urlencode 'query=up{job="monitoring-app"}' \
                    | python3 -c 'import json,sys; r=json.load(sys.stdin)["data"]["result"]; print(r[0]["value"][1] if r else "")' \
                    2>/dev/null || true)
            if [ "$value" = "1" ]; then
              echo "target up after $((i * 3))s"
              exit 0
            fi
            sleep 3
          done
          echo "::error::prometheus never reported the target as up"
          echo "--- active targets ---"
          curl -sS http://localhost:9090/api/v1/targets | python3 -m json.tool || true
          echo "--- prometheus logs ---"
          docker compose logs --no-color prometheus | tail -60
          echo "--- app logs ---"
          docker compose logs --no-color app | tail -60
          echo "--- compose ps ---"
          docker compose ps -a
          exit 1
      - name: Grafana is serving
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/health | grep -q '"database"'; then
              echo "grafana healthy after ${i}s"
              exit 0
            fi
            sleep 2
          done
          echo "::error::grafana never reported healthy"
          docker compose logs --no-color grafana | tail -40
          exit 1
      - name: Tear down
        if: always()
        run: docker compose down -v
