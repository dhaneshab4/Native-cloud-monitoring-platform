# Prod: canary delivery through Argo Rollouts, autoscaling on, spread across
# nodes, and an IRSA-annotated service account so the pod gets AWS credentials
# from the cluster's OIDC provider rather than from a mounted static key.

replicaCount: 3

image:
  pullPolicy: IfNotPresent

rollout:
  enabled: true
  steps:
    - setWeight: 10
    - pause: {duration: 60s}
    - setWeight: 34
    - pause: {duration: 60s}
    - setWeight: 67
    - pause: {duration: 60s}
    - setWeight: 100

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: 2

serviceAccount:
  create: true
  annotations: {}
    # Filled by Terraform output `app_irsa_role_arn`:
    # eks.amazonaws.com/role-arn: arn:aws:iam::<account>:role/monitoring-app-prod

config:
  LOG_LEVEL: "INFO"

resources:
  requests: {cpu: 100m, memory: 128Mi}
  limits: {cpu: 1000m, memory: 512Mi}

topologySpreadEnabled: true
