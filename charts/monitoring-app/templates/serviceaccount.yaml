{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "monitoring-app.serviceAccountName" . }}
  labels:
    {{- include "monitoring-app.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The pod does not call the Kubernetes API, so it has no use for a projected
# API token — mounting one only widens what a compromised container can reach.
automountServiceAccountToken: false
{{- end }}
